x-app: &app
    image: supplier-management-dev
    build:
        context: .
        args:
            LOCAL_UID: ${LOCAL_UID:-1000}
            LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /var/www/html
    volumes:
        - .:/var/www/html
    init: true
    dns:
        - 1.1.1.1
        - 8.8.8.8

services:
    app:
        <<: *app
        ports:
            - '127.0.0.1:8000:8000'
        depends_on:
            mysql:
                condition: service_healthy

    vite:
        <<: *app
        command: npm run dev
        ports:
            - '127.0.0.1:5173:5173'

    queue:
        <<: *app
        command: php artisan queue:work --tries=3 --timeout=90
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-supplier_management}
            MYSQL_USER: ${DB_USERNAME:-supplier}
            MYSQL_PASSWORD: ${DB_PASSWORD:-local_password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e ''SELECT 1'' >/dev/null 2>&1',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    mysql-data:
